services:
  - type: web
    name: sijil-alfasl
    runtime: static
    staticPublishPath: ./public
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
